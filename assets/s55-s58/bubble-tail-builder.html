<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bubble &amp; tail builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f1319;
  --panel:#161c26;
  --panel-2:#1d2431;
  --line:#2a3444;
  --line-soft:#212a37;
  --fg:#e7edf7;
  --fg-dim:#8e9cb3;
  --accent:#4ea1ff;
  --accent-soft:#12304f;
  --grid:#1a2230;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--ink);color:var(--fg);font-family:var(--sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100vh}

/* ---------- rail ---------- */
.rail{
  background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:20px 18px 40px;
}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:22px}
.brand b{font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:-.02em}
.brand span{font-family:var(--mono);font-size:11px;color:var(--fg-dim)}

fieldset{border:0;padding:0;margin:0 0 22px}
legend{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--fg-dim);padding:0 0 10px;
}
.row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.row label{flex:0 0 62px;font-size:12px;color:var(--fg-dim)}
.row output{
  flex:0 0 50px;text-align:right;font-family:var(--mono);font-size:12px;
  color:var(--fg);
}
input[type=range]{
  flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;
  background:var(--line);outline:none;min-width:0;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--accent);cursor:grab;border:2px solid var(--panel);
}
input[type=range]::-moz-range-thumb{
  width:13px;height:13px;border-radius:50%;background:var(--accent);
  cursor:grab;border:2px solid var(--panel);
}
input[type=range]:focus-visible{box-shadow:0 0 0 2px var(--accent-soft)}
input[type=color]{
  -webkit-appearance:none;appearance:none;width:30px;height:24px;padding:0;
  border:1px solid var(--line);border-radius:4px;background:none;cursor:pointer;
}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
input[type=color]::-webkit-color-swatch{border:0;border-radius:2px}
input[type=text],textarea{
  flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);
  color:var(--fg);border-radius:4px;padding:6px 8px;font-family:var(--mono);
  font-size:12px;resize:vertical;
}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}

.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:12px}
.seg button{
  font-family:var(--mono);font-size:11px;padding:7px 0;cursor:pointer;
  background:var(--panel-2);color:var(--fg-dim);border:1px solid var(--line);
  border-radius:4px;transition:color .12s,border-color .12s;
}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed=true]{color:var(--accent);border-color:var(--accent)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- stage ---------- */
.stage{display:flex;flex-direction:column;min-width:0}
.canvas{
  flex:1;position:relative;overflow:hidden;
  background:
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 28px,
    var(--ink);
}
.hint{
  position:absolute;top:14px;left:16px;font-family:var(--mono);font-size:11px;
  color:var(--fg-dim);letter-spacing:.02em;pointer-events:none;
}

#bubble{
  position:absolute;left:16%;top:20%;max-width:330px;
  padding:15px 17px;font-size:13px;line-height:1.55;cursor:move;
  user-select:none;
}
#bubble p{margin:0}
#tailSvg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}

.handle{
  position:absolute;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;
  border-radius:50%;background:var(--accent);border:2px solid var(--ink);
  cursor:grab;touch-action:none;
}
.handle:active{cursor:grabbing}
.handle:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.readout{
  position:absolute;transform:translate(14px,-26px);font-family:var(--mono);
  font-size:11px;color:var(--accent);white-space:nowrap;pointer-events:none;
}

/* ---------- code ---------- */
.code{
  border-top:1px solid var(--line);background:var(--panel);
  height:270px;display:flex;flex-direction:column;
}
.tabs{
  display:flex;align-items:center;gap:2px;padding:0 12px;
  border-bottom:1px solid var(--line-soft);
}
.tabs button{
  font-family:var(--mono);font-size:11px;letter-spacing:.04em;
  background:none;border:0;border-bottom:2px solid transparent;
  color:var(--fg-dim);padding:11px 12px;cursor:pointer;
}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
.spacer{flex:1}
#copy{
  font-family:var(--mono);font-size:11px;padding:5px 12px;margin-left:8px;
  background:var(--accent);color:#07121f;border:0;border-radius:4px;
  cursor:pointer;font-weight:600;
}
#copy:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
pre{
  margin:0;flex:1;overflow:auto;padding:14px 16px;
  font-family:var(--mono);font-size:12px;line-height:1.65;color:#c3d0e2;
  white-space:pre;tab-size:2;
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:820px){
  .app{grid-template-columns:1fr;height:auto}
  .rail{border-right:0;border-bottom:1px solid var(--line)}
  .canvas{height:400px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <aside class="rail">
    <div class="brand"><b>tail.css</b><span>bubble builder</span></div>

    <fieldset>
      <legend>Tail anchor</legend>
      <div class="seg" id="edges">
        <button data-edge="bottom" aria-pressed="true">btm</button>
        <button data-edge="top" aria-pressed="false">top</button>
        <button data-edge="left" aria-pressed="false">left</button>
        <button data-edge="right" aria-pressed="false">right</button>
      </div>
      <div class="row">
        <label for="offset">Offset</label>
        <input type="range" id="offset" min="6" max="94" value="76" step="1">
        <output for="offset" id="offsetV">76%</output>
      </div>
      <div class="row">
        <label for="base">Base</label>
        <input type="range" id="base" min="4" max="48" value="18" step="1">
        <output for="base" id="baseV">18px</output>
      </div>
      <div class="row">
        <label for="len">Length</label>
        <input type="range" id="len" min="20" max="320" value="130" step="1">
        <output for="len" id="lenV">130px</output>
      </div>
      <div class="row">
        <label for="ang">Tilt</label>
        <input type="range" id="ang" min="-85" max="85" value="34" step="1">
        <output for="ang" id="angV">34°</output>
      </div>
    </fieldset>

    <fieldset>
      <legend>Bubble</legend>
      <div class="row">
        <label for="wide">Width</label>
        <input type="range" id="wide" min="160" max="420" value="330" step="2">
        <output for="wide" id="wideV">330px</output>
      </div>
      <div class="row">
        <label for="pad">Padding</label>
        <input type="range" id="pad" min="4" max="36" value="15" step="1">
        <output for="pad" id="padV">15px</output>
      </div>
      <div class="row">
        <label for="rad">Radius</label>
        <input type="range" id="rad" min="0" max="28" value="4" step="1">
        <output for="rad" id="radV">4px</output>
      </div>
      <div class="row">
        <label for="bw">Border</label>
        <input type="range" id="bw" min="0" max="6" value="1" step="0.5">
        <output for="bw" id="bwV">1px</output>
      </div>
    </fieldset>

    <fieldset>
      <legend>Colour</legend>
      <div class="row">
        <label for="fill">Fill</label>
        <input type="color" id="fill" value="#d6e7f3">
        <input type="text" id="fillHex" value="#d6e7f3" spellcheck="false">
      </div>
      <div class="row">
        <label for="stroke">Stroke</label>
        <input type="color" id="stroke" value="#1f4fa8">
        <input type="text" id="strokeHex" value="#1f4fa8" spellcheck="false">
      </div>
      <div class="row">
        <label for="ink">Text</label>
        <input type="color" id="ink" value="#12203a">
        <input type="text" id="inkHex" value="#12203a" spellcheck="false">
      </div>
    </fieldset>

    <fieldset>
      <legend>Content</legend>
      <textarea id="copyText" rows="4">Many people may not know how to use the Internet. So we put people on the ground and distribute tasks to contributors.</textarea>
    </fieldset>
  </aside>

  <main class="stage">
    <div class="canvas" id="canvas">
      <p class="hint">Drag the bubble to move · drag the dot to aim the tail</p>

      <figure id="bubble">
        <svg id="tailSvg" aria-hidden="true">
          <polygon id="tailFill"></polygon>
          <line id="tailCover"></line>
          <path id="tailEdge" fill="none"></path>
        </svg>
        <p id="bubbleText"></p>
      </figure>

      <div class="handle" id="handle" tabindex="0" role="slider"
           aria-label="Tail tip position" aria-valuemin="20" aria-valuemax="320" aria-valuenow="130"></div>
      <div class="readout" id="readout"></div>
      <p class="sr" id="live" aria-live="polite"></p>
    </div>

    <section class="code">
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-tab="css">CSS</button>
        <button role="tab" aria-selected="false" data-tab="html">HTML</button>
        <button role="tab" aria-selected="false" data-tab="svg">SVG tail</button>
        <button role="tab" aria-selected="false" data-tab="vars">Tokens</button>
        <span class="spacer"></span>
        <button id="copy">Copy</button>
      </div>
      <pre id="out"></pre>
    </section>
  </main>
</div>

<script>
(function(){
  var S = {
    edge:'bottom', offset:76, base:18, len:130, ang:34,
    wide:330, pad:15, rad:4, bw:1,
    fill:'#d6e7f3', stroke:'#1f4fa8', ink:'#12203a',
    text:'', x:null, y:null, tab:'css'
  };

  var $ = function(id){ return document.getElementById(id); };
  var canvas=$('canvas'), bubble=$('bubble'), svg=$('tailSvg'),
      tailFill=$('tailFill'), tailEdge=$('tailEdge'),
      handle=$('handle'), readout=$('readout'), out=$('out'), live=$('live');

  var sliders=['offset','base','len','ang','wide','pad','rad','bw'];
  var units={offset:'%',ang:'\u00B0'};

  function unit(k){ return units[k]!==undefined?units[k]:'px'; }

  /* ---- geometry ---- */
  function anchor(){
    var w=bubble.offsetWidth, h=bubble.offsetHeight, o=S.offset/100, m=S.bw/2;
    if(S.edge==='bottom') return {x:w*o, y:h-m, nx:0, ny:1};
    if(S.edge==='top')    return {x:w*o, y:m,   nx:0, ny:-1};
    if(S.edge==='left')   return {x:m,   y:h*o, nx:-1, ny:0};
    return {x:w-m, y:h*o, nx:1, ny:0};
  }
  function tip(){
    var a=anchor(), r=S.ang*Math.PI/180;
    var c=Math.cos(r), s=Math.sin(r);
    return { x:a.x + (a.nx*c - a.ny*s)*S.len,
             y:a.y + (a.ny*c + a.nx*s)*S.len };
  }

  function render(){
    bubble.style.maxWidth=S.wide+'px';
    bubble.style.padding=S.pad+'px '+Math.round(S.pad*1.15)+'px';
    bubble.style.background=S.fill;
    bubble.style.border=S.bw+'px solid '+S.stroke;
    bubble.style.borderRadius=S.rad+'px';
    bubble.style.color=S.ink;
    $('bubbleText').textContent=S.text;

    var w=bubble.offsetWidth, h=bubble.offsetHeight;
    var a=anchor(), t=tip(), hb=S.base/2;
    var px=-a.ny, py=a.nx;
    var p1={x:a.x+px*hb, y:a.y+py*hb}, p2={x:a.x-px*hb, y:a.y-py*hb};

    svg.setAttribute('width',w); svg.setAttribute('height',h);
    svg.style.left=(-S.bw)+'px'; svg.style.top=(-S.bw)+'px';
    tailFill.setAttribute('fill',S.fill);
    tailFill.setAttribute('points',
      p1.x+','+p1.y+' '+p2.x+','+p2.y+' '+t.x+','+t.y);

    var cover=$('tailCover');
    cover.setAttribute('x1',p1.x); cover.setAttribute('y1',p1.y);
    cover.setAttribute('x2',p2.x); cover.setAttribute('y2',p2.y);
    cover.setAttribute('stroke',S.fill);
    cover.setAttribute('stroke-width',S.bw?S.bw+0.6:0);
    cover.setAttribute('stroke-linecap','butt');

    tailEdge.setAttribute('stroke',S.stroke);
    tailEdge.setAttribute('stroke-width',S.bw);
    tailEdge.setAttribute('stroke-linejoin','round');
    tailEdge.setAttribute('d',
      'M'+p1.x+' '+p1.y+' L'+t.x+' '+t.y+' L'+p2.x+' '+p2.y);

    var bx=bubble.offsetLeft, by=bubble.offsetTop;
    handle.style.left=(bx+t.x)+'px'; handle.style.top=(by+t.y)+'px';
    handle.setAttribute('aria-valuenow',Math.round(S.len));
    readout.style.left=(bx+t.x)+'px'; readout.style.top=(by+t.y)+'px';
    readout.textContent=Math.round(S.len)+'px · '+Math.round(S.ang)+'\u00B0';

    emit();
  }

  /* ---- code output ---- */
  function tokens(){
    return [
      '--bubble-fill: '+S.fill+';',
      '--bubble-stroke: '+S.stroke+';',
      '--bubble-ink: '+S.ink+';',
      '--bubble-pad: '+S.pad+'px;',
      '--bubble-radius: '+S.rad+'px;',
      '--bubble-border: '+S.bw+'px;',
      '--tail-offset: '+S.offset+'%;',
      '--tail-base: '+S.base+'px;',
      '--tail-len: '+Math.round(S.len)+'px;',
      '--tail-angle: '+Math.round(S.ang)+'deg;'
    ].join('\n');
  }

  function cssCode(){
    var side={bottom:'top:calc(100% + var(--bubble-border));left:var(--tail-offset);',
              top:'bottom:calc(100% + var(--bubble-border));left:var(--tail-offset);',
              left:'right:calc(100% + var(--bubble-border));top:var(--tail-offset);',
              right:'left:calc(100% + var(--bubble-border));top:var(--tail-offset);'}[S.edge];
    var tf={bottom:'translateX(-50%) rotate(var(--tail-angle))',
            top:'translateX(-50%) rotate(calc(180deg - var(--tail-angle)))',
            left:'translateY(-50%) rotate(calc(90deg + var(--tail-angle)))',
            right:'translateY(-50%) rotate(calc(-90deg + var(--tail-angle)))'}[S.edge];
    var org={bottom:'50% 0',top:'50% 0',left:'50% 0',right:'50% 0'}[S.edge];
    return '.bubble {\n'+
      tokens().split('\n').map(function(l){return '  '+l;}).join('\n')+'\n\n'+
      '  position: relative;\n'+
      '  max-width: '+S.wide+'px;\n'+
      '  margin: 0;\n'+
      '  padding: var(--bubble-pad) calc(var(--bubble-pad) * 1.15);\n'+
      '  background: var(--bubble-fill);\n'+
      '  border: var(--bubble-border) solid var(--bubble-stroke);\n'+
      '  border-radius: var(--bubble-radius);\n'+
      '  color: var(--bubble-ink);\n'+
      '  line-height: 1.55;\n'+
      '}\n\n'+
      '.bubble::after {\n'+
      '  content: "";\n'+
      '  position: absolute;\n'+
      '  '+side+'\n'+
      '  width: var(--tail-base);\n'+
      '  height: var(--tail-len);\n'+
      '  background: var(--bubble-fill);\n'+
      '  clip-path: polygon(0 0, 100% 0, 50% 100%);\n'+
      '  transform: '+tf+';\n'+
      '  transform-origin: '+org+';\n'+
      '}\n\n'+
      '/* clip-path can\'t take a border, so the bubble border still draws\n'+
      '   straight across the tail base. Fine when --bubble-border is 0.\n'+
      '   With a visible border, use the SVG tab instead. */';
  }

  function htmlCode(){
    return '<figure class="bubble">\n'+
      '  <blockquote>\n'+
      '    '+S.text+'\n'+
      '  </blockquote>\n'+
      '</figure>';
  }

  function svgCode(){
    var w=bubble.offsetWidth, h=bubble.offsetHeight;
    var a=anchor(), t=tip(), hb=S.base/2, px=-a.ny, py=a.nx;
    var r=function(n){ return Math.round(n*10)/10; };
    var p1x=r(a.x+px*hb), p1y=r(a.y+py*hb), p2x=r(a.x-px*hb), p2y=r(a.y-py*hb);
    var tx=r(t.x), ty=r(t.y);
    var neg=-S.bw;
    return '<!-- child of .bubble; negative offset puts it in the border box -->\n'+
      '<svg class="bubble__tail" width="'+w+'" height="'+h+'"\n'+
      '     style="position:absolute;left:'+neg+'px;top:'+neg+'px;\n'+
      '            overflow:visible;pointer-events:none"\n'+
      '     aria-hidden="true">\n'+
      '  <polygon fill="'+S.fill+'"\n'+
      '    points="'+p1x+','+p1y+' '+p2x+','+p2y+' '+tx+','+ty+'" />\n'+
      (S.bw ?
      '  <line x1="'+p1x+'" y1="'+p1y+'" x2="'+p2x+'" y2="'+p2y+'"\n'+
      '        stroke="'+S.fill+'" stroke-width="'+(S.bw+0.6)+'" stroke-linecap="butt" />\n' : '')+
      '  <path fill="none" stroke="'+S.stroke+'" stroke-width="'+S.bw+'"\n'+
      '        stroke-linejoin="round"\n'+
      '        d="M'+p1x+' '+p1y+' L'+tx+' '+ty+' L'+p2x+' '+p2y+'" />\n'+
      '</svg>';
  }

  function emit(){
    out.textContent = S.tab==='css' ? cssCode()
                    : S.tab==='html' ? htmlCode()
                    : S.tab==='svg' ? svgCode()
                    : ':root {\n'+tokens().split('\n').map(function(l){return '  '+l;}).join('\n')+'\n}';
  }

  /* ---- controls ---- */
  sliders.forEach(function(k){
    var el=$(k), o=$(k+'V');
    el.addEventListener('input',function(){
      S[k]=parseFloat(el.value);
      o.textContent=el.value+unit(k);
      render();
    });
    o.textContent=el.value+unit(k);
    S[k]=parseFloat(el.value);
  });

  document.querySelectorAll('#edges button').forEach(function(b){
    b.addEventListener('click',function(){
      S.edge=b.dataset.edge;
      document.querySelectorAll('#edges button').forEach(function(x){
        x.setAttribute('aria-pressed', String(x===b));
      });
      render();
    });
  });

  [['fill','fillHex'],['stroke','strokeHex'],['ink','inkHex']].forEach(function(pair){
    var c=$(pair[0]), t=$(pair[1]);
    c.addEventListener('input',function(){ S[pair[0]]=c.value; t.value=c.value; render(); });
    t.addEventListener('input',function(){
      if(/^#[0-9a-f]{6}$/i.test(t.value)){ S[pair[0]]=t.value; c.value=t.value; render(); }
    });
  });

  var ta=$('copyText');
  S.text=ta.value;
  ta.addEventListener('input',function(){ S.text=ta.value; render(); });

  /* ---- tabs + copy ---- */
  document.querySelectorAll('.tabs [role=tab]').forEach(function(b){
    b.addEventListener('click',function(){
      S.tab=b.dataset.tab;
      document.querySelectorAll('.tabs [role=tab]').forEach(function(x){
        x.setAttribute('aria-selected', String(x===b));
      });
      emit();
    });
  });

  $('copy').addEventListener('click',function(){
    var btn=this, txt=out.textContent;
    var done=function(){ btn.textContent='Copied'; setTimeout(function(){ btn.textContent='Copy'; },1400); };
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(txt).then(done,fallback);
    } else { fallback(); }
    function fallback(){
      var ta=document.createElement('textarea');
      ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); done(); }
      catch(e){ btn.textContent='Select manually'; setTimeout(function(){btn.textContent='Copy';},1800); }
      document.body.removeChild(ta);
    }
  });

  /* ---- dragging ---- */
  function drag(el,onMove){
    el.addEventListener('pointerdown',function(e){
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      var r=canvas.getBoundingClientRect();
      var start={mx:e.clientX-r.left, my:e.clientY-r.top,
                 bx:bubble.offsetLeft, by:bubble.offsetTop};
      function move(ev){
        onMove(ev.clientX-r.left, ev.clientY-r.top, start);
      }
      function up(ev){
        el.releasePointerCapture(ev.pointerId);
        el.removeEventListener('pointermove',move);
        el.removeEventListener('pointerup',up);
      }
      el.addEventListener('pointermove',move);
      el.addEventListener('pointerup',up);
    });
  }

  drag(bubble,function(mx,my,s){
    bubble.style.left=Math.max(0,s.bx+(mx-s.mx))+'px';
    bubble.style.top=Math.max(0,s.by+(my-s.my))+'px';
    render();
  });

  drag(handle,function(mx,my){
    var a=anchor();
    var dx=mx-bubble.offsetLeft-a.x, dy=my-bubble.offsetTop-a.y;
    var L=Math.min(320,Math.max(20,Math.hypot(dx,dy)));
    var ang=Math.atan2(a.nx*dy-a.ny*dx, a.nx*dx+a.ny*dy)*180/Math.PI;
    ang=Math.max(-85,Math.min(85,ang));
    S.len=L; S.ang=ang;
    $('len').value=Math.round(L); $('lenV').textContent=Math.round(L)+'px';
    $('ang').value=Math.round(ang); $('angV').textContent=Math.round(ang)+'\u00B0';
    render();
  });

  handle.addEventListener('keydown',function(e){
    var step=e.shiftKey?10:2, k=e.key, hit=true;
    if(k==='ArrowUp') S.len=Math.min(320,S.len+step);
    else if(k==='ArrowDown') S.len=Math.max(20,S.len-step);
    else if(k==='ArrowRight') S.ang=Math.min(85,S.ang+step);
    else if(k==='ArrowLeft') S.ang=Math.max(-85,S.ang-step);
    else hit=false;
    if(hit){
      e.preventDefault();
      $('len').value=Math.round(S.len); $('lenV').textContent=Math.round(S.len)+'px';
      $('ang').value=Math.round(S.ang); $('angV').textContent=Math.round(S.ang)+'\u00B0';
      live.textContent='Length '+Math.round(S.len)+' pixels, tilt '+Math.round(S.ang)+' degrees';
      render();
    }
  });

  window.addEventListener('resize',render);
  render();
})();
</script>
</body>
</html>
